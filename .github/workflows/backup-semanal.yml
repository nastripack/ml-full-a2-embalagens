name: Backup semanal do D1

on:
  schedule:
    # 12:00 UTC = 09:00 America/Sao_Paulo (Brasil nao observa horario de verao)
    - cron: "0 12 * * 1"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions do GitHub

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exportar banco D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # ml_auth guarda access_token/refresh_token do OAuth do Mercado Livre em texto plano - nunca
        # deve ir para o dump exportado (que fica versionado no git). E' suporte tecnico da
        # autenticacao, nao faz parte do historico de negocio que o backup existe para preservar; se
        # o dump for restaurado, a loja so precisa refazer /auth/login para reconectar.
        run: |
          DATA=$(date +%Y-%m-%d)
          npx wrangler d1 export ml-full-a2-embalagens-db --remote --output="backups/backup-${DATA}.sql" \
            --table=lojas --table=produtos --table=estoque_historico --table=vendas \
            --table=envios --table=performance_historico --table=eventos --table=missoes \
            --table=custos_transporte --table=vendas_fora_full

      - name: Manter so os 8 backups mais recentes
        run: |
          cd backups
          ls -1t backup-*.sql | tail -n +9 | xargs -r rm --

      - name: Commitar e enviar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if ! git diff --cached --quiet; then
            git commit -m "Backup semanal do D1 - $(date +%Y-%m-%d)"
            git push
          else
            echo "Nada novo para commitar."
          fi
